<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Benim Sitem</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #1e3a8a);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 600px;
      padding: 40px 25px;
      background: rgba(255,255,255,0.08);
      border-radius: 25px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    p {
      font-size: 18px;
      color: #d1d5db;
      margin-bottom: 25px;
    }

    button {
      border: none;
      padding: 14px 25px;
      border-radius: 12px;
      background: white;
      color: #111827;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.95);
    }

    #mesaj {
      margin-top: 20px;
      font-size: 18px;
      color: #93c5fd;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Benim Sitem</h1>

    <p>
      Buraya kendi yazını, fotoğraflarını ve videolarını ekleyebilirsin.
    </p>

    <button onclick="mesajGoster()">
      Tıkla
    </button>

    <div id="mesaj"></div>
  </div>

  <script>
    function mesajGoster() {
      document.getElementById("mesaj").textContent =
        "Site çalışıyor! 🚀";
    }
  </script>

</body>
</html>
