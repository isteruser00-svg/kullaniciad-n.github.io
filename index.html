<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fotoğraflarım</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 25px 0;
}

.ekran {
    display: none;
}

.ekran.active {
    display: block;
}

.foto {
    width: 90%;
    height: 500px;
    object-fit: cover;
    border-radius: 20px;
    cursor: pointer;
}

.yazi {
    display: none;
    margin: 25px auto;
    width: 80%;
    padding: 15px;
    background: white;
    color: black;
    border-radius: 15px;
    font-size: 20px;
    cursor: pointer;
}

.yazi.goster {
    display: block;
}
</style>
</head>

<body>

<h1>Fotoğraflarım</h1>

<!-- 1. FOTOĞRAF -->
<div class="ekran active" id="ekran1">

    <img
    class="foto"
    src="Screenshot_2026-09-09-00-35-37-998_com.zhiliaoapp.musically.jpg"
    onclick="yaziGoster(1)"
    >

    <div class="yazi" id="yazi1" onclick="sonraki(1)">
        Buraya 1. fotoğrafın yazısı gelecek
    </div>

</div>


<!-- 2. FOTOĞRAF -->
<div class="ekran" id="ekran2">

    <img
    class="foto"
    src="Screenshot_2026-08-26-23-48-56-518_com.zhiliaoapp.musically.jpg"
    onclick="yaziGoster(2)"
    >

    <div class="yazi" id="yazi2" onclick="sonraki(2)">
        Buraya 2. fotoğrafın yazısı gelecek
    </div>

</div>


<!-- 3. FOTOĞRAF -->
<div class="ekran" id="ekran3">

    <img
    class="foto"
    src="IMG_20260928_184509.jpg"
    onclick="yaziGoster(3)"
    >

    <div class="yazi" id="yazi3" onclick="sonraki(3)">
        Buraya 3. fotoğrafın yazısı gelecek
    </div>

</div>


<script>

function yaziGoster(numara) {
    document.getElementById("yazi" + numara)
    .classList.add("goster");
}


function sonraki(numara) {

    document.getElementById("ekran" + numara)
    .classList.remove("active");

    let sonrakiNumara = numara + 1;

    if (sonrakiNumara > 3) {
        sonrakiNumara = 1;
    }

    document.getElementById("ekran" + sonrakiNumara)
    .classList.add("active");
}

</script>

</body>
</html>
